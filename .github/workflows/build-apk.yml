        shell: bash
        run: |
          echo "09ccd0db93da81cc0d61bf0cd9563a79b00c9cc8e0d7e781500a5787964b7e20  .github/scripts/v15_patch.txt" | sha256sum -c -
          base64 -d .github/scripts/v15_patch.txt | gzip -dc > /tmp/v15_patch.py
          python3 -m py_compile /tmp/v15_patch.py
          python3 /tmp/v15_patch.py
          sed -i 's|^import androidx.compose.foundation.transformable$|import androidx.compose.foundation.gestures.transformable|' native-project/app/src/main/java/com/velvetfiles/app/MainActivity.kt
          grep -F 'versionName = "1.5"' native-project/app/build.gradle.kts

      - name: Inspect media track and gesture handlers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native-project/app/src/main/java/com/velvetfiles/app/MainActivity.kt")
          lines = p.read_text().splitlines()
          terms = ("seekTo(", "onAudio", "audioTrack", "TrackSelection", "setMediaItem", "setAudioAttributes", "detectDragGestures", "detectVerticalDragGestures", "pointerInput", "Slider(", "currentPosition", "currentPositionMs", "selectedAudio", "audioTracks", "TrackGroup")
          found = set()
          for i, line in enumerate(lines):
              if any(t.lower() in line.lower() for t in terms):
                  for j in range(max(0, i-3), min(len(lines), i+5)):
                      found.add(j)
          for i in sorted(found):
              print(f"{i+1}: {lines[i]}")
          PY

      - name: Export patched Kotlin source for validation
        uses: actions/upload-artifact@v4
        with:
          name: Velvet-Files-Source-Diagnostic
          path: |
            native-project/app/src/main/java/com/velvetfiles/app/MainActivity.kt
            native-project/app/build.gradle.kts
          retention-days: 1

      - name: Build APK and run Android unit tests
        shell: bash
        run: gradle -p native-project assembleDebug testDebugUnitTest --stacktrace

      - name: Verify v1.5 APK package
        shell: bash
        run: |
          APK="$(find native-project/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then echo "::error::No debug APK found"; exit 1; fi
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/velvet-badging.txt
          grep -q "versionCode='6' versionName='1.5'" /tmp/velvet-badging.txt
          echo "Verified package versionCode 6 / versionName 1.5."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velvet-Files-APK
          path: native-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
