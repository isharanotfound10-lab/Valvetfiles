name: Build File Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Velvet_Files_Native_Android_Project.zip"
      - "Velvet_Files_Native_Android_Project (3).zip"
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate and extract the intended project ZIP
        shell: bash
        run: |
          ZIP_FILE="./Velvet_Files_Native_Android_Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="./Velvet_Files_Native_Android_Project (3).zip"
          fi
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Expected Velvet_Files_Native_Android_Project.zip (or the existing (3) backup) in the repository root."
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi
          echo "Using project ZIP: $ZIP_FILE"
          rm -rf native-project
          mkdir -p native-project
          unzip -o "$ZIP_FILE" -d native-project
          if [ ! -f native-project/app/build.gradle.kts ]; then
            echo "::error::ZIP layout invalid: app/build.gradle.kts was not found after extraction."
            find native-project -maxdepth 5 -type f | sort | head -100
            exit 1
          fi

      - name: Patch Compose import and hide pending media files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("native-project/app/src/main/java/com/velvetfiles/app/MainActivity.kt")
          if not source.is_file():
              raise SystemExit("MainActivity.kt was not found after extracting project ZIP")
          code = source.read_text()

          # Fix the known missing Compose border import in older source ZIPs.
          if "import androidx.compose.foundation.border" not in code:
              code = code.replace(
                  "import androidx.compose.foundation.background",
                  "import androidx.compose.foundation.background\nimport androidx.compose.foundation.border",
                  1,
              )

          # Android can leave unpublished files named .pending-* on shared storage.
          # Hide them in folder listings and recursive category/recent/search scans;
          # never rename or delete the underlying files.
          if "private fun isPendingTemporaryName(name: String)" not in code:
              marker = "private fun listDirectory(folder: File, showHidden: Boolean = false): List<FileEntry> = try {"
              if marker not in code:
                  raise SystemExit("Could not locate listDirectory() to patch pending filenames")
              code = code.replace(
                  marker,
                  'private fun isPendingTemporaryName(name: String): Boolean = name.startsWith(".pending-", ignoreCase = true)\n\n' + marker,
                  1,
              )

          old_directory_filter = 'folder.listFiles()?.filter { it.canRead() && (showHidden || !it.name.startsWith(".")) }'
          new_directory_filter = 'folder.listFiles()?.filter { it.canRead() && !isPendingTemporaryName(it.name) && (showHidden || !it.name.startsWith(".")) }'
          if new_directory_filter not in code:
              if old_directory_filter not in code:
                  raise SystemExit("Could not locate folder listing filter for pending filenames")
              code = code.replace(old_directory_filter, new_directory_filter, 1)

          old_scan_filter = 'if ((!showHidden && child.name.startsWith(".")) || path.contains("/Android/data/")'
          new_scan_filter = 'if (isPendingTemporaryName(child.name) || (!showHidden && child.name.startsWith(".")) || path.contains("/Android/data/")'
          if new_scan_filter not in code:
              if old_scan_filter not in code:
                  raise SystemExit("Could not locate recursive scan filter for pending filenames")
              code = code.replace(old_scan_filter, new_scan_filter, 1)

          if not all(part in code for part in (
              "import androidx.compose.foundation.border",
              "private fun isPendingTemporaryName(name: String)",
              "!isPendingTemporaryName(it.name)",
              "if (isPendingTemporaryName(child.name)",
          )):
              raise SystemExit("Source verification failed after patching")
          source.write_text(code)
          print("Patched and verified Compose border import and .pending-* filename filtering.")
          PY

      - name: Build debug APK
        shell: bash
        run: gradle -p native-project assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velvet-Files-APK
          path: native-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
