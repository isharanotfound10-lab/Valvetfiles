name: Build Velvet Files APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Velvet_Files_Native_Android_Project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK manager
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract project
        run: |
          mkdir -p native-project
          unzip -o Velvet_Files_Native_Android_Project.zip -d native-project

      - name: Build APK
        run: gradle -p native-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Velvet-Files-APK
          path: native-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
