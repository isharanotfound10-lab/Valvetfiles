name: Build File Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Velvet_Files_Native_Android_Project.zip"
      - "Velvet_Files_Native_Android_Project (3).zip"
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate and extract the intended project ZIP
        shell: bash
        run: |
          ZIP_FILE="./Velvet_Files_Native_Android_Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="./Velvet_Files_Native_Android_Project (3).zip"
          fi
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Expected Velvet_Files_Native_Android_Project.zip (or the existing (3) backup) in the repository root."
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi
          echo "Using project ZIP: $ZIP_FILE"
          rm -rf native-project
          mkdir -p native-project
          unzip -o "$ZIP_FILE" -d native-project
          if [ ! -f native-project/app/build.gradle.kts ]; then
            echo "::error::ZIP layout invalid: app/build.gradle.kts was not found after extraction."
            find native-project -maxdepth 5 -type f | sort | head -100
            exit 1
          fi

      - name: Patch missing Compose border import if needed
        shell: bash
        run: |
          SOURCE_FILE="native-project/app/src/main/java/com/velvetfiles/app/MainActivity.kt"
          if [ ! -f "$SOURCE_FILE" ]; then
            echo "::error::MainActivity.kt was not found after extraction."
            exit 1
          fi
          if ! grep -q '^import androidx.compose.foundation.border$' "$SOURCE_FILE"; then
            sed -i '/^import androidx.compose.foundation.background$/a import androidx.compose.foundation.border' "$SOURCE_FILE"
          fi
          grep -n '^import androidx.compose.foundation.border$' "$SOURCE_FILE"

      - name: Build debug APK
        shell: bash
        run: gradle -p native-project assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velvet-Files-APK
          path: native-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
